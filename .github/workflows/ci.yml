name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run for the previous one
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# The job names (Checks, E2E, Image) are the required checks of the main branch rules
# on GitHub: rename a job there too, or no PR can be merged.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_crm
          # A throwaway server that lives only for this job, so no password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests run on personal_crm_test, which they create themselves
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/personal_crm
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The checks below run even when one of them fails, so a run shows every problem at once
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_crm
          # A throwaway server that lives only for this job, so no password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests run on personal_crm_e2e_test, which they create themselves
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/personal_crm
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds and starts the app itself, see playwright.config.ts
      - name: E2E tests
        run: pnpm test:e2e

      # Screenshots and step-by-step traces of the failed tests
      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The same build as in deploy.yml, without pushing the image anywhere
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
