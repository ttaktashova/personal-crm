name: Deploy

on:
  push:
    branches: [main]

# Runs go one at a time in the order of the commits, so an older commit never deploys over a newer
# one; a newer push waits for the running one to finish
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The same image goes to staging and prod, side by side: one failing does not stop the other.
  # Prod does not wait for staging yet.
  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            dir: /opt/personal-crm/staging
            url: https://test-app.testblacklist.ru
          - environment: prod
            dir: /opt/personal-crm
            url: https://app.testblacklist.ru
    # The deploy history of each environment is on GitHub: repository → Environments
    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.url }}
    # Two deploys to one environment never run at the same time; a newer one waits
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      DEPLOY_DIR: ${{ matrix.dir }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host server
            HostName ${{ vars.DEPLOY_HOST }}
            User ${{ vars.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      # The whole deploy/ folder goes to the environment's own folder (/opt/personal-crm/deploy,
      # /opt/personal-crm/staging/deploy), so a new script there arrives by itself and a staging
      # deploy never replaces the scripts a prod deploy is running
      - name: Copy deploy scripts to the server
        run: scp -r deploy "server:$DEPLOY_DIR/"

      - name: Deploy on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | ssh server bash "$DEPLOY_DIR/deploy/deploy.sh" "$ENVIRONMENT" "$IMAGE" "$GITHUB_ACTOR"
