# Production stack on the server: compose project "prod", run by deploy/deploy.sh.
# Values come from /opt/personal-crm/.env (see deploy/server.env.example); APP_IMAGE is set by deploy.sh.

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off container from the new image: applies migrations and exits
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    profiles: [migrate]
    working_dir: /app/migrate
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
    # Loopback only: the outside world reaches the app through nginx
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
