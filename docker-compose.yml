services:
  postgres:
    image: postgres:18-alpine
    container_name: personal-crm-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A mail catcher: the app sends sign-in emails here (SMTP_URL=smtp://127.0.0.1:1025), and the
  # page at http://127.0.0.1:8025 shows them. Nothing reaches a real mailbox.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: personal-crm-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
